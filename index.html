<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<title>分かち合いカード</title>
<style>
:root{
  --bg:#eceef1; --ink:#2c3550; --sub:#7c8296; --accent:#d78744; --accent-dark:#b96f34;
  --navy:#283763; --navy2:#334578; --card:#ffffff; --border:#dcdfe6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c2030; --ink:#eceef5; --sub:#9aa0b8; --accent:#e0925c; --accent-dark:#c97b45;
    --navy:#1c2544; --navy2:#28356a; --card:#262b40; --border:#3a4060;
  }
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:20px 16px 56px;
}
h1{
  font-family:"DotGothic16","Zen Maru Gothic",sans-serif;
  font-size:1.3rem; font-weight:400; margin:10px 0 6px; text-align:center; letter-spacing:.03em;
}
.sub{color:var(--sub); font-size:.88rem; margin-bottom:22px; text-align:center;}

.nav{
  display:flex; gap:6px; background:var(--card); border:1px solid var(--border);
  border-radius:999px; padding:4px; margin-bottom:18px; position:sticky; top:8px; z-index:5;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}
.nav button{
  font-family:"Zen Maru Gothic",sans-serif; font-weight:700; font-size:.82rem;
  padding:9px 18px; border-radius:999px; border:none; cursor:pointer;
  background:transparent; color:var(--sub); box-shadow:none;
}
.nav button.active{ background:var(--accent); color:#fff; }

.view{ width:100%; max-width:400px; display:none; flex-direction:column; align-items:center; }
.view.active{ display:flex; }

.book-wrap{ perspective:1400px; margin-bottom:26px; padding-bottom:32px; }
.book{
  position:relative; width:280px; height:360px;
  transform-style:preserve-3d; transition:transform .65s cubic-bezier(.4,.1,.2,1);
}
.book.flipped{ transform:rotateY(180deg); }
.face{
  position:absolute; inset:0; border-radius:20px; backface-visibility:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.front{
  background-image:linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
  border:1px solid rgba(255,255,255,.08); padding:26px 20px;
}
.front::after{
  content:""; position:absolute; inset:14px; border:1.5px dashed rgba(255,255,255,.28);
  border-radius:12px; pointer-events:none;
}
.spine{
  position:absolute; right:-7px; top:8px; bottom:8px; width:10px;
  background:repeating-linear-gradient(180deg, var(--accent) 0 6px, var(--accent-dark) 6px 12px);
  border-radius:0 6px 6px 0; box-shadow:2px 0 6px rgba(0,0,0,.15);
}
.star{ position:absolute; color:rgba(255,255,255,.55); font-size:14px; }
.star.s1{ top:16%; left:14%; } .star.s2{ top:32%; right:12%; font-size:18px;} .star.s3{ bottom:16%; right:16%; }
.logo-circle{
  width:118px; height:118px; border-radius:50%; background:#fff;
  display:flex; align-items:center; justify-content:center; margin-bottom:18px;
  box-shadow:0 4px 14px rgba(0,0,0,.25); border:3px solid rgba(255,255,255,.5); overflow:hidden;
}
.logo-img{ width:76%; height:76%; object-fit:contain; }
.book-title{ color:#fff; text-align:center; font-size:1rem; font-weight:700; line-height:1.6; opacity:.95; }
.bookmark{
  position:absolute; bottom:-28px; left:50%; transform:translateX(-50%);
  width:22px; height:44px; background:var(--accent);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);
}
.back{ background:var(--card); border:1px solid var(--border); transform:rotateY(180deg); padding:34px 26px; text-align:center; }
.back .q-text{ font-size:1.95rem; font-weight:700; line-height:1.9; color:var(--ink); animation:fadeIn .4s ease; overflow-wrap:anywhere; max-width:100%; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

button{
  font-family:"DotGothic16","Zen Maru Gothic",sans-serif; border:none; cursor:pointer; border-radius:999px;
  padding:15px 40px; font-size:.85rem; font-weight:400; color:#fff;
  background:var(--accent); box-shadow:0 4px 12px rgba(0,0,0,.15);
  transition:transform .15s ease, opacity .15s ease;
}
button:active{ transform:scale(.96); }
button:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; }

.counter{ margin-top:18px; font-size:.95rem; color:var(--sub); }
.counter b{ color:var(--ink); font-size:1.05rem; }
.dashes{ width:200px; height:0; margin-top:10px; border-top:2.5px dashed var(--accent); opacity:.55; }
.load-error{ color:#c65b4f; font-size:.85rem; text-align:center; margin-top:14px; display:none; }

.history{ width:100%; margin-top:34px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px 20px; }
.history-toggle{ display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:700; font-size:.95rem; user-select:none; }
.history-toggle .arrow{ transition:transform .2s ease; font-size:.75rem; color:var(--sub); }
.history.collapsed .arrow{ transform:rotate(-90deg); }
.history-body{ margin-top:14px; }
.history.collapsed .history-body{ display:none; }
.empty-msg{ color:var(--sub); font-size:.9rem; margin-bottom:14px; }
#historyList{ list-style:none; margin:0 0 16px; padding:0; display:flex; flex-direction:column; gap:10px; }
#historyList li{ font-size:.88rem; line-height:1.6; padding:10px 12px; background:var(--bg); border-radius:10px; border:1px solid var(--border); overflow-wrap:anywhere; }
#historyList li b{ color:var(--accent-dark); margin-right:6px; }
.reset{ background:transparent; color:var(--sub); border:1px solid var(--border); box-shadow:none; padding:10px 20px; font-size:.85rem; width:100%; }

.qcard{ width:100%; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 18px; }
.qrows{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.qrows li{
  display:flex; align-items:flex-start; gap:10px; font-size:.88rem; line-height:1.6;
  padding:10px 12px; background:var(--bg); border-radius:10px; border:1px solid var(--border); overflow-wrap:anywhere;
}
.qrows li .idx{ color:var(--accent-dark); font-weight:700; flex-shrink:0; }
</style>
</head>

        </div>

          <div class="q-text" id="qText"></div>

    <div class="counter">あと <b id="remainCount">0</b> 枚</div>
    <div class="dashes"></div>
    <div class="load-error" id="loadError">質問を読み込めませんでした。questions.json を確認してください。</div>

    <div class="history" id="historyPanel">
      <div class="history-toggle" id="historyToggle"><span class="arrow">▼</span> めくったカード</div>
      <div class="history-body">
        <div class="empty-msg" id="emptyMsg">まだめくったカードはないよ～</div>
        <ul id="historyList"></ul>
        <button class="reset" id="resetBtn">はじめからやりなおす</button>

      <ul class="qrows" id="listRows"></ul>
    </div>
  </section>

<script>
let questions = [];
let remaining = [];
let used = [];
let animating = false;

const book = document.getElementById('book');
const drawBtn = document.getElementById('drawBtn');
const resetBtn = document.getElementById('resetBtn');
const remainCount = document.getElementById('remainCount');
const qText = document.getElementById('qText');
const historyList = document.getElementById('historyList');
const emptyMsg = document.getElementById('emptyMsg');
const historyPanel = document.getElementById('historyPanel');
const historyToggle = document.getElementById('historyToggle');
const listRows = document.getElementById('listRows');
const loadError = document.getElementById('loadError');

function resetDrawPool(){
  remaining = questions.map((_, i) => i);
  used = [];
  animating = false;
  book.classList.remove('flipped');
  qText.textContent = '';
  drawBtn.disabled = questions.length === 0;
  drawBtn.textContent = 'カードをめくる';
}

function renderHistory(){
  remainCount.textContent = remaining.length;
  historyList.innerHTML = '';
  if(used.length === 0){
    emptyMsg.style.display = 'block';
  } else {
    emptyMsg.style.display = 'none';
    used.forEach((qi, i) => {
      const li = document.createElement('li');
      const b = document.createElement('b');
      b.textContent = (i + 1) + '.';
      li.appendChild(b);
      li.appendChild(document.createTextNode(questions[qi]));
      historyList.appendChild(li);
    });
  }
}

function renderList(){
  listRows.innerHTML = '';
  questions.forEach((text, i) => {
    const li = document.createElement('li');
    const idx = document.createElement('span');
    idx.className = 'idx';
    idx.textContent = (i + 1) + '.';
    const t = document.createElement('span');
    t.textContent = text;
    li.appendChild(idx);
    li.appendChild(t);
    listRows.appendChild(li);
  });
}

function draw(){
  if(remaining.length === 0 || animating) return;
  animating = true;
  drawBtn.disabled = true;

  const revealNext = () => {
    const pick = Math.floor(Math.random() * remaining.length);
    const qi = remaining[pick];
    remaining.splice(pick, 1);
    used.push(qi);

    qText.textContent = questions[qi];
    book.classList.add('flipped');
    renderHistory();

    setTimeout(() => {
      animating = false;
      if(remaining.length === 0){
        drawBtn.textContent = 'すべて引きました 🎉';
      } else {
        drawBtn.disabled = false;
        drawBtn.textContent = '次のカードをめくる';
      }
    }, 650);
  };

  if(book.classList.contains('flipped')){
    book.classList.remove('flipped');
    setTimeout(revealNext, 650);
  } else {
    revealNext();
  }
}

historyToggle.addEventListener('click', () => historyPanel.classList.toggle('collapsed'));
drawBtn.addEventListener('click', draw);
resetBtn.addEventListener('click', () => { resetDrawPool(); renderHistory(); });

function switchView(name){
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
}
document.querySelectorAll('.nav button').forEach(b => {
  b.addEventListener('click', () => switchView(b.dataset.view));
});

async function init(){
  try{
    const res = await fetch('questions.json', { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    questions = data.filter(t => typeof t === 'string' && t.trim()).map(t => t.trim());
    if(questions.length === 0) throw new Error('empty');
  }catch(e){
    questions = [];
    loadError.style.display = 'block';
  }
  resetDrawPool();
  renderHistory();
  renderList();
}
init();
</script>
